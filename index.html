<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suivi des lots — Devis & Factures</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #4f7cff;
    --accent-hover: #3a63e0;
    --danger: #e5484d;
    --success: #2fbf71;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  header.top h1 { font-size: 20px; margin: 0; }
  .filter-info { font-size: 12px; color: var(--muted); margin-top: 4px; }
  header.top .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { border-color: var(--accent); }
  .btn.small { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Login */
  #loginScreen {
    max-width: 360px; margin: 80px auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 32px;
  }
  #loginScreen h2 { margin-top: 0; font-size: 18px; }
  #loginScreen label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  #loginScreen input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #0c0e12; color: var(--text); font-size: 14px;
  }
  #loginScreen .btn { width: 100%; margin-top: 20px; padding: 10px; }
  #loginError { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* Lots */
  .lot-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .lot-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; cursor: pointer;
  }
  .lot-header:hover { background: #1b1f28; }
  .lot-title { font-size: 15px; font-weight: 600; }
  .lot-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
    background: #23304a; color: #7ea6ff; white-space: nowrap;
  }
  .lot-body { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
  .lot-body.open { display: block; }
  .lot-section { margin-top: 18px; }
  .lot-section h4 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); margin: 0 0 8px;
  }
  .generate-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .generate-bar label {
    font-size: 12px; color: var(--muted); display: flex; gap: 6px;
    align-items: center; cursor: pointer;
  }

  .doc-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .doc-item:last-child .doc-row { border-bottom: none; }
  .doc-ref { font-weight: 600; }
  .doc-meta { color: var(--muted); font-size: 12px; }
  .doc-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .doc-actions .act {
    font-size: 12px; padding: 5px 10px; border-radius: 6px; text-decoration: none;
    border: 1px solid var(--border); color: var(--text); background: transparent;
    cursor: pointer; font-family: inherit;
  }
  .doc-actions .act:hover { border-color: var(--accent); color: var(--accent); }
  .doc-actions .act.primary { border-color: var(--accent); color: var(--accent); }
  .empty-note { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }

  .msg { font-size: 12px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.success { background: #12281c; color: var(--success); }
  .msg.error { background: #2b1416; color: #ff8a8e; }
  .msg.info { background: #1c2436; color: #8fb0ff; }

  .explain {
    margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--border);
    border-radius: 8px; background: #12151b; font-size: 12px;
  }
  .explain-title { font-weight: 600; margin-bottom: 8px; }
  .explain-row { margin: 6px 0; line-height: 1.5; }
  .explain-row .codes { color: var(--muted); }
  .explain-alert { margin-top: 8px; color: #e9b949; }
  .explain-note { color: var(--muted); }
  .invoice-panel {
    display: none; margin: 4px 0 10px; padding: 12px; border: 1px dashed var(--border);
    border-radius: 8px; background: #12151b;
  }
  .invoice-panel.open { display: block; }
  .avoirs-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .avoir-row { display: grid; grid-template-columns: 1fr 1.4fr 110px 28px; gap: 8px; margin-bottom: 8px; }
  .avoir-row input {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: #0c0e12; color: var(--text); font-size: 12px; min-width: 0;
  }
  .avoir-row .rm { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .panel-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

  /* Contenu du lot */
  .summary { font-size: 12px; color: var(--muted); margin: 0 0 6px; line-height: 1.7; }
  .summary strong { color: var(--text); }
  .warn { color: #e9b949; font-size: 12px; margin-bottom: 8px; }
  .devices-wrap { overflow-x: auto; }
  table.devices { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.devices th {
    text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.devices td { padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.devices .num { text-align: right; }
  .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 999px; margin-left: 6px;
    background: #23304a; color: #7ea6ff;
  }
  .tag.budget { background: #3a2f16; color: #e9b949; }
  .no-price { color: #ff8a8e; }
  .muted { color: var(--muted); }
  .tag.reception { background: #2a2540; color: #b6a2ff; }
  .tag.ff { background: #3a2416; color: #ff9f6b; }
  .diff { color: #e9b949; font-weight: 600; }

  #emptyState, #loadingState, #errorState {
    text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px;
  }
  #errorState { color: var(--danger); }
  .chevron { transition: transform 0.15s; color: var(--muted); }
  .chevron.open { transform: rotate(90deg); }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>Connexion</h2>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" />
  <label for="password">Mot de passe</label>
  <input id="password" type="password" autocomplete="current-password" />
  <button class="btn" id="loginBtn">Se connecter</button>
  <div id="loginError"></div>
</div>

<div class="container" id="appScreen" style="display:none;">
  <header class="top">
    <div>
      <h1>Lots en cours</h1>
      <div id="filterInfo" class="filter-info"></div>
    </div>
    <div class="actions">
      <button class="btn secondary" id="refreshBtn">Actualiser</button>
      <button class="btn secondary" id="logoutBtn">Se déconnecter</button>
    </div>
  </header>

  <div id="loadingState">Chargement des lots…</div>
  <div id="errorState" style="display:none;"></div>
  <div id="emptyState" style="display:none;">Aucun lot actif pour le moment.</div>
  <div id="lotsList"></div>
</div>

<script>
  // ============================================================
  // Configuration
  // ============================================================
  const SUPABASE_URL = "https://zvqoxgugzfxbkhmqgvdk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2cW94Z3VnemZ4YmtobXFndmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4MjUzMDcsImV4cCI6MjA2NjQwMTMwN30.vdpTmNn2yhu1mnbmC-LamuvBvqD_Q8DGZ2GYNEZyux0";
  // ============================================================

  // Nommé "sb" : le CDN déclare déjà une variable globale "supabase"
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");
  const loginError = document.getElementById("loginError");
  const loadingState = document.getElementById("loadingState");
  const errorState = document.getElementById("errorState");
  const emptyState = document.getElementById("emptyState");
  const lotsList = document.getElementById("lotsList");
  const filterInfo = document.getElementById("filterInfo");

  const EXCLUDED_STATUSES = ["Vendu", "Restitué", "Annulé", "Refusé"];

  // Seuls les lots dont le fournisseur a un nom CONTENANT ce texte
  // (insensible à la casse) sont affichés.
  const SUPPLIER_FILTER = "doneo";

  // ------------------------------------------------------------
  // Utilitaires
  // ------------------------------------------------------------
  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtDate(d) {
    if (!d) return "-";
    return new Date(d).toLocaleDateString("fr-FR");
  }

  function fmtMoney(n) {
    if (n === null || n === undefined) return "-";
    return Number(n).toFixed(2) + " €";
  }

  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  function parseAmount(v) {
    const n = parseFloat(String(v).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }

  function showMsg(el, kind, text) {
    el.className = "msg show " + kind;
    el.textContent = text;
  }

  function clearMsg(el) {
    el.className = "msg";
    el.textContent = "";
  }

  function setBusy(btn, busy, busyText) {
    if (busy) {
      btn.dataset.label = btn.textContent;
      btn.textContent = busyText;
      btn.disabled = true;
    } else {
      btn.textContent = btn.dataset.label ?? btn.textContent;
      btn.disabled = false;
    }
  }

  // Appelle une edge function et remonte le message d'erreur renvoyé
  // par la fonction (ex. "devis déjà émis"), pas un message générique.
  async function callFunction(name, body) {
    const { data, error } = await sb.functions.invoke(name, { body });
    if (error) {
      let message = error.message || "Erreur inconnue";
      try {
        const payload = await error.context.json();
        if (payload && payload.error) {
          message = payload.error;
          if (typeof payload.details === "string") {
            message += " — " + payload.details;
          } else if (payload.details && payload.details.message) {
            message += " — " + payload.details.message;
          }
        }
      } catch (_) {
        // pas de corps JSON exploitable : on garde le message générique
      }
      throw new Error(message);
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  // Le PDF est hébergé sur un autre domaine : l'attribut HTML "download"
  // y est ignoré. On récupère le fichier puis on force le téléchargement ;
  // si le navigateur refuse (CORS), on l'ouvre dans un nouvel onglet.
  async function downloadPdf(url, filename) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch (_) {
      window.open(url, "_blank", "noopener");
    }
  }

  // ------------------------------------------------------------
  // Authentification
  // ------------------------------------------------------------
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) showApp(); else showLogin();
  }

  function showLogin() {
    loginScreen.style.display = "block";
    appScreen.style.display = "none";
  }

  function showApp() {
    loginScreen.style.display = "none";
    appScreen.style.display = "block";
    loadLots();
  }

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    loginError.textContent = "";

    if (!email || !password) {
      loginError.textContent = "Email et mot de passe requis.";
      return;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = "Connexion échouée : " + error.message;
      return;
    }
    showApp();
  });

  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    showLogin();
  });

  document.getElementById("refreshBtn").addEventListener("click", () => loadLots());

  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") showLogin();
  });

  // ------------------------------------------------------------
  // Liste des lots actifs
  // ------------------------------------------------------------
  async function loadLots() {
    loadingState.style.display = "block";
    errorState.style.display = "none";
    emptyState.style.display = "none";
    lotsList.innerHTML = "";

    // 0. Fournisseur(s) correspondant au filtre (ex. DONEO)
    const { data: suppliers, error: suppliersError } = await sb
      .from("suppliers")
      .select("id, name")
      .ilike("name", `%${SUPPLIER_FILTER}%`);

    if (suppliersError) {
      loadingState.style.display = "none";
      errorState.style.display = "block";
      errorState.textContent = "Erreur de chargement des fournisseurs : " + suppliersError.message;
      return;
    }
    if (!suppliers || suppliers.length === 0) {
      loadingState.style.display = "none";
      errorState.style.display = "block";
      errorState.textContent = `Aucun fournisseur dont le nom contient « ${SUPPLIER_FILTER} » n'a été trouvé.`;
      return;
    }
    const supplierIds = suppliers.map((sup) => sup.id);
    filterInfo.textContent = "Fournisseur : " + suppliers.map((sup) => sup.name).join(", ");

    // 1. Lots non archivés de ce(s) fournisseur(s), avec client/fournisseur.
    // Supabase renvoie au maximum 1000 lignes par requête : on lit par
    // pages successives pour ne rien tronquer.
    const PAGE_SIZE = 1000;
    let lots = [];
    for (let from = 0; ; from += PAGE_SIZE) {
      const { data, error } = await sb
        .from("sales_purchase_lots")
        .select("id, name, type, created_at, client_id, supplier_id, clients(name, margin), suppliers(name)")
        .eq("archived", false)
        .in("supplier_id", supplierIds)
        .order("created_at", { ascending: false })
        .range(from, from + PAGE_SIZE - 1);

      if (error) {
        loadingState.style.display = "none";
        errorState.style.display = "block";
        errorState.textContent = "Erreur de chargement des lots : " + error.message;
        return;
      }
      lots = lots.concat(data ?? []);
      if (!data || data.length < PAGE_SIZE) break;
    }

    if (lots.length === 0) {
      loadingState.style.display = "none";
      emptyState.style.display = "block";
      return;
    }

    // 2. Actions de ces lots, triées du plus récent au plus ancien : on
    // garde la première rencontrée par lot (= la plus récente) pour
    // connaître son statut actuel.
    // Les identifiants sont envoyés par petits paquets : tous dans une
    // seule URL, elle devient trop longue et la requête échoue.
    const CHUNK_SIZE = 30;
    const chunks = [];
    for (let i = 0; i < lots.length; i += CHUNK_SIZE) {
      chunks.push(lots.slice(i, i + CHUNK_SIZE).map((l) => l.id));
    }

    const results = await Promise.all(
      chunks.map((ids) =>
        sb
          .from("sales_purchase_lot_actions")
          .select("sales_purchase_lot_id, status, created_at")
          .eq("archived", false)
          .in("sales_purchase_lot_id", ids)
          .order("created_at", { ascending: false })
      )
    );

    loadingState.style.display = "none";

    const failed = results.find((r) => r.error);
    if (failed) {
      errorState.style.display = "block";
      errorState.textContent = "Erreur de chargement des statuts : " + failed.error.message;
      return;
    }

    const actions = results
      .flatMap((r) => r.data ?? [])
      .sort((a, b) => (a.created_at < b.created_at ? 1 : -1));

    const latestStatusByLot = {};
    for (const a of actions) {
      if (!(a.sales_purchase_lot_id in latestStatusByLot)) {
        latestStatusByLot[a.sales_purchase_lot_id] = a.status;
      }
    }

    // 3. Filtrage : garder seulement les lots avec un statut connu,
    // qui n'est pas dans la liste exclue
    const activeLots = lots
      .filter((lot) => {
        const status = latestStatusByLot[lot.id];
        return status && !EXCLUDED_STATUSES.includes(status);
      })
      .map((lot) => ({
        ...lot,
        client_name: lot.clients?.name ?? null,
        supplier_name: lot.suppliers?.name ?? null,
        last_status: latestStatusByLot[lot.id],
      }));

    if (activeLots.length === 0) {
      emptyState.style.display = "block";
      return;
    }

    for (const lot of activeLots) {
      lotsList.appendChild(renderLotCard(lot));
    }
  }

  // ------------------------------------------------------------
  // Carte d'un lot
  // ------------------------------------------------------------
  function renderLotCard(lot) {
    const card = document.createElement("div");
    card.className = "lot-card";

    const header = document.createElement("div");
    header.className = "lot-header";
    header.innerHTML = `
      <div>
        <div class="lot-title">${escapeHtml(lot.name)}</div>
        <div class="lot-sub">${escapeHtml(lot.client_name ?? "-")} · ${escapeHtml(lot.supplier_name ?? "-")}${lot.type ? " · " + escapeHtml(lot.type) : ""}</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="status-badge">${escapeHtml(lot.last_status ?? "-")}</span>
        <span class="chevron">▶</span>
      </div>
    `;

    const body = document.createElement("div");
    body.className = "lot-body";

    // Zone "génération de devis"
    const actionsEl = document.createElement("div");
    actionsEl.innerHTML = `
      <div class="generate-bar">
        <button class="btn small" data-role="gen-quote">Générer un devis</button>
        <label>
          <input type="checkbox" data-role="ref-interne" />
          Référence interne (code-barres) au lieu de la référence prestation
        </label>
        <button class="btn secondary small" data-role="recalc" title="Recalcule les prix automatiques du lot ; les prix personnalisés sont conservés">Recalculer les prix auto</button>
      </div>
      <div class="msg" data-role="lot-msg"></div>
      <div data-role="explain"></div>
    `;

    const docsEl = document.createElement("div");
    const devicesEl = document.createElement("div");
    devicesEl.className = "lot-section";

    body.append(actionsEl, docsEl, devicesEl);

    const lotMsgEl = actionsEl.querySelector('[data-role="lot-msg"]');
    const ctx = {
      lot,
      docsEl,
      devicesEl,
      explainEl: actionsEl.querySelector('[data-role="explain"]'),
      lotMsg: (kind, text) => showMsg(lotMsgEl, kind, text),
      clearLotMsg: () => clearMsg(lotMsgEl),
    };

    const genQuoteBtn = actionsEl.querySelector('[data-role="gen-quote"]');
    const refInterneBox = actionsEl.querySelector('[data-role="ref-interne"]');
    genQuoteBtn.addEventListener("click", () =>
      onGenerateQuote(ctx, genQuoteBtn, refInterneBox.checked)
    );

    const recalcBtn = actionsEl.querySelector('[data-role="recalc"]');
    recalcBtn.addEventListener("click", () => onRecalculate(ctx, recalcBtn));

    let loaded = false;
    header.addEventListener("click", async () => {
      const isOpen = body.classList.toggle("open");
      header.querySelector(".chevron").classList.toggle("open", isOpen);
      if (isOpen && !loaded) {
        loaded = true;
        await Promise.all([loadDocuments(ctx), loadDevices(lot, devicesEl)]);
      }
    });

    card.appendChild(header);
    card.appendChild(body);
    return card;
  }

  // ------------------------------------------------------------
  // Contenu du lot (appareils + prix)
  // ------------------------------------------------------------
  function unwrapDevices(data) {
    if (!Array.isArray(data)) return [];
    // forme alternative éventuelle : [{ array_agg: [...] }]
    if (data.length === 1 && data[0] && Array.isArray(data[0].array_agg)) {
      return data[0].array_agg;
    }
    return data;
  }

  // Même ordre de priorité que la génération du devis :
  // prix personnalisé > prix auto du lot > prix budget.
  function basePriceOf(d) {
    if (d.sale_price_custom != null) return { value: Number(d.sale_price_custom), source: "perso" };
    if (d.sale_price_client != null) return { value: Number(d.sale_price_client), source: "auto" };
    if (d.sale_price_auto != null) return { value: Number(d.sale_price_auto), source: "budget" };
    return { value: null, source: null };
  }

  async function loadDevices(lot, el) {
    el.innerHTML = `<h4>Contenu du lot</h4><div class="empty-note">Chargement du contenu…</div>`;

    // Le grade retenu par le calcul du prix (qualité, sinon réception) vient
    // de explain_sale_lot_prices, pour ne pas dupliquer cette logique ici.
    // Si cette fonction n'est pas installée, on affiche le grade qualité seul.
    // Le devis actuel (lignes figées à sa génération) sert à repérer les écarts
    // entre les prix d'aujourd'hui et ceux qu'il contient.
    const [devicesRes, gradesRes, quoteRes] = await Promise.all([
      sb.rpc("get_salelot_devices", { salelot_id_param: lot.id, files_param: false }),
      sb.rpc("explain_sale_lot_prices", { p_sale_lot_id: lot.id }),
      sb
        .from("quote")
        .select("reference, subtotal_ht, lines_snapshot")
        .eq("sale_purchase_lot_id", lot.id)
        .neq("status", "cancelled")
        .order("created_at", { ascending: false })
        .limit(1),
    ]);
    const { data, error } = devicesRes;

    const gradeInfo = {};
    if (!gradesRes.error) {
      for (const g of gradesRes.data ?? []) gradeInfo[g.device_id] = g;
    }

    const currentQuote =
      !quoteRes.error && quoteRes.data && quoteRes.data.length ? quoteRes.data[0] : null;
    const quoteUnitByRef = new Map();
    if (currentQuote && Array.isArray(currentQuote.lines_snapshot)) {
      for (const l of currentQuote.lines_snapshot) quoteUnitByRef.set(String(l.reference), Number(l.unit_price));
    }
    const hasQuoteLines = quoteUnitByRef.size > 0;

    if (error) {
      el.innerHTML = `<h4>Contenu du lot</h4><div class="empty-note">Erreur : ${escapeHtml(error.message)}</div>`;
      return;
    }

    const devices = unwrapDevices(data);

    // Mémorisé pour comparer avant/après un recalcul des prix auto
    lot.devicesCount = devices.length;
    lot.autoBefore = {};
    for (const d of devices) {
      lot.autoBefore[d.id] = d.sale_price_client != null ? Number(d.sale_price_client) : null;
    }

    if (devices.length === 0) {
      el.innerHTML = `<h4>Contenu du lot</h4><div class="empty-note">Aucun appareil dans ce lot.</div>`;
      return;
    }

    const margin = lot.clients?.margin ?? 1;
    let totalBase = 0;
    let totalQuote = 0;
    let noPrice = 0;
    let gradeFromReception = 0;
    let differs = 0;
    let absentFromQuote = 0;

    const rows = devices
      .map((d) => {
        const p = basePriceOf(d);
        if (p.value === null) noPrice++;
        const base = p.value ?? 0;
        totalBase += base;
        totalQuote += round2(base * margin);

        const quotePrice = round2(base * margin);

        // FlutterFlow affiche sale_price_final : le prix de facturation importé y
        // est prioritaire, alors que le devis l'ignore. On le signale s'il diffère.
        const ffFinal = d.sale_price_final != null ? Number(d.sale_price_final) : null;
        const ffTag =
          ffFinal !== null && Math.abs(ffFinal - base) > 0.005
            ? `<span class="tag ff" title="FlutterFlow affiche ce prix : le prix de facturation importé y est prioritaire, mais pas dans le devis">FlutterFlow ${fmtMoney(ffFinal)}</span>`
            : "";

        const priceCell =
          (p.value === null
            ? `<span class="no-price">sans prix</span>`
            : `${fmtMoney(p.value)}<span class="tag ${p.source === "budget" ? "budget" : ""}">${p.source}</span>`) + ffTag;

        const quotePriceCell =
          p.value === null ? `<span class="no-price">${fmtMoney(0)}</span>` : fmtMoney(quotePrice);

        // Prix de cet appareil sur le devis actuel (repéré par sa référence)
        let onQuoteTd = "";
        if (hasQuoteLines) {
          let q = quoteUnitByRef.get(String(d.barcode));
          if (q === undefined && d.service_provision_reference) {
            q = quoteUnitByRef.get(String(d.service_provision_reference));
          }
          if (q === undefined) {
            absentFromQuote++;
            onQuoteTd = `<td class="num"><span class="muted">absent</span></td>`;
          } else if (Math.abs(q - quotePrice) > 0.005) {
            differs++;
            onQuoteTd = `<td class="num"><span class="diff" title="Le devis actuel a un autre prix que le calcul d'aujourd'hui">${fmtMoney(q)}</span></td>`;
          } else {
            onQuoteTd = `<td class="num">${fmtMoney(q)}</td>`;
          }
        }

        // Grade qualité si l'appareil en a un ; sinon celui de la dernière
        // réception, signalé par une pastille, car c'est celui du calcul du prix.
        let gradeCell;
        const info = gradeInfo[d.id];
        if (d.quality_grade) {
          gradeCell = escapeHtml(d.quality_grade);
        } else if (info && info.grade_utilise) {
          gradeFromReception++;
          gradeCell = `${escapeHtml(info.grade_utilise)}<span class="tag reception" title="Aucune action qualité : grade de la dernière réception, utilisé pour le calcul du prix auto">réception</span>`;
        } else {
          gradeCell = `<span class="muted">—</span>`;
        }

        return `
          <tr>
            <td>${escapeHtml(d.barcode)}</td>
            <td>${escapeHtml(d.service_provision_reference ?? "")}</td>
            <td>${escapeHtml(d.service_sub_category_name ?? "")}</td>
            <td>${escapeHtml(d.brand_name ?? "")}</td>
            <td>${escapeHtml(d.model ?? "")}</td>
            <td>${gradeCell}</td>
            <td class="num">${d.price_new != null ? fmtMoney(d.price_new) : "-"}</td>
            <td class="num">${priceCell}</td>
            <td class="num">${quotePriceCell}</td>
            ${onQuoteTd}
          </tr>`;
      })
      .join("");

    el.innerHTML = `
      <h4>Contenu du lot</h4>
      <div class="summary">
        <strong>${devices.length}</strong> appareil(s)${gradeFromReception ? ` (dont <strong>${gradeFromReception}</strong> avec le grade de la réception, faute d'action qualité)` : ""} ·
        Total prix de base <strong>${fmtMoney(totalBase)}</strong> ·
        Coefficient client <strong>×${String(margin).replace(".", ",")}</strong> ·
        Devis HT si généré maintenant <strong>${fmtMoney(totalQuote)}</strong>
      </div>
      <div class="summary">Prix de base : avant coefficient client. Prix devis : prix de base × coefficient, tel qu'il apparaîtrait sur un devis généré maintenant.</div>
      ${currentQuote ? `<div class="summary">Devis actuel <strong>${escapeHtml(currentQuote.reference)}</strong> : total HT <strong>${fmtMoney(currentQuote.subtotal_ht)}</strong></div>` : ""}
      ${differs || absentFromQuote ? `<div class="warn">⚠ ${differs} ligne(s) du devis actuel ont un autre prix que le calcul d'aujourd'hui${absentFromQuote ? `, ${absentFromQuote} appareil(s) absent(s) du devis` : ""} : il date d'avant une modification des prix (ou du lot). Générez un nouveau devis pour les appliquer.</div>` : ""}
      ${noPrice ? `<div class="warn">⚠ ${noPrice} appareil(s) sans prix : ils seraient comptés à 0 € dans le devis.</div>` : ""}
      <div class="devices-wrap">
        <table class="devices">
          <thead>
            <tr>
              <th>Code-barres</th><th>Réf. prestation</th><th>Type</th><th>Marque</th>
              <th>Modèle</th><th>Grade</th><th class="num">Prix neuf</th><th class="num">Prix de base</th>
              <th class="num">Prix devis (×coef.)</th>${hasQuoteLines ? '<th class="num">Devis actuel</th>' : ""}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // Devis et factures d'un lot
  // ------------------------------------------------------------
  async function loadDocuments(ctx) {
    const { lot, docsEl } = ctx;

    const { data: quotes, error: quotesError } = await sb
      .from("quote")
      .select("id, reference, status, subtotal_ht, total_ttc, pdf_url, created_at")
      .eq("sale_purchase_lot_id", lot.id)
      .neq("status", "cancelled")
      .order("created_at", { ascending: false });

    if (quotesError) {
      docsEl.innerHTML = `<div class="lot-section"><div class="empty-note">Erreur devis : ${escapeHtml(quotesError.message)}</div></div>`;
      return;
    }

    lot.activeQuote = (quotes ?? [])[0] ?? null;

    const quoteIds = (quotes ?? []).map((q) => q.id);
    let invoices = [];
    let invoicesError = null;
    if (quoteIds.length > 0) {
      const { data: inv, error: invError } = await sb
        .from("invoice")
        .select("id, reference, status, total_ttc, pdf_url, created_at, quote_id")
        .in("quote_id", quoteIds)
        .neq("status", "cancelled")
        .order("created_at", { ascending: false });
      if (invError) invoicesError = invError; else invoices = inv ?? [];
    }

    docsEl.innerHTML = `
      <div class="lot-section"><h4>Devis</h4><div data-role="quotes"></div></div>
      <div class="lot-section"><h4>Factures</h4><div data-role="invoices"></div></div>
    `;
    const quotesEl = docsEl.querySelector('[data-role="quotes"]');
    const invoicesEl = docsEl.querySelector('[data-role="invoices"]');

    if (!quotes || quotes.length === 0) {
      quotesEl.innerHTML = `<div class="empty-note">Aucun devis actif.</div>`;
    } else {
      for (const q of quotes) {
        const activeInvoice = invoices.find((i) => i.quote_id === q.id) ?? null;
        quotesEl.appendChild(renderQuoteItem(ctx, q, activeInvoice));
      }
    }

    if (invoicesError) {
      invoicesEl.innerHTML = `<div class="empty-note">Erreur factures : ${escapeHtml(invoicesError.message)}</div>`;
    } else if (invoices.length === 0) {
      invoicesEl.innerHTML = `<div class="empty-note">Aucune facture active.</div>`;
    } else {
      for (const inv of invoices) {
        const item = document.createElement("div");
        item.className = "doc-item";
        item.innerHTML = docRowHtml(inv, null);
        attachDownload(item, inv);
        invoicesEl.appendChild(item);
      }
    }
  }

  function docRowHtml(doc, extraLabel) {
    const hasPdf = !!doc.pdf_url;
    return `
      <div class="doc-row">
        <div>
          <div class="doc-ref">${escapeHtml(doc.reference)}</div>
          <div class="doc-meta">${fmtDate(doc.created_at)} · ${fmtMoney(doc.total_ttc)} TTC · ${escapeHtml(doc.status)}</div>
        </div>
        <div class="doc-actions">
          ${
            hasPdf
              ? `<a class="act" href="${escapeHtml(doc.pdf_url)}" target="_blank" rel="noopener">Aperçu</a>
                 <button class="act" data-role="download">Télécharger</button>`
              : `<span class="doc-meta">PDF indisponible</span>`
          }
          ${extraLabel ? `<button class="act primary" data-role="invoice-toggle">${escapeHtml(extraLabel)}</button>` : ""}
        </div>
      </div>`;
  }

  function attachDownload(root, doc) {
    const btn = root.querySelector('[data-role="download"]');
    if (btn) btn.addEventListener("click", () => downloadPdf(doc.pdf_url, doc.reference + ".pdf"));
  }

  // ------------------------------------------------------------
  // Génération d'un devis
  // ------------------------------------------------------------
  async function onGenerateQuote(ctx, btn, refInterne) {
    const { lot } = ctx;
    ctx.clearLotMsg();

    if (lot.activeQuote) {
      const ok = confirm(
        `Un devis actif existe déjà (${lot.activeQuote.reference}).\n\n` +
        `S'il diffère du nouveau, il sera annulé, ainsi que sa facture éventuelle.\n` +
        `(S'il est identique, rien ne sera créé.)\n\nContinuer ?`
      );
      if (!ok) return;
    }

    setBusy(btn, true, "Génération…");
    try {
      const data = await callFunction("generate-quote", {
        sale_purchase_lot_id: lot.id,
        ref_interne: refInterne,
      });
      ctx.lotMsg("success", `Devis ${data.quote.reference} généré.`);
      await loadDocuments(ctx);
    } catch (e) {
      const already = /déjà émis/i.test(e.message);
      ctx.lotMsg(already ? "info" : "error", already ? "Devis déjà émis : rien n'a changé depuis le dernier devis." : e.message);
    } finally {
      setBusy(btn, false);
    }
  }

  // ------------------------------------------------------------
  // Recalcul des prix AUTO d'un lot (les prix personnalisés sont conservés)
  // ------------------------------------------------------------
  function sameAmount(a, b) {
    if (a == null && b == null) return true;
    if (a == null || b == null) return false;
    return Math.abs(Number(a) - Number(b)) < 0.005;
  }

  async function onRecalculate(ctx, btn) {
    const { lot } = ctx;
    ctx.clearLotMsg();
    ctx.explainEl.innerHTML = "";

    const ok = confirm(
      `Recalculer les prix automatiques de tous les appareils du lot « ${lot.name} » ?\n\n` +
      `Les prix personnalisés ne sont pas modifiés.\n` +
      `Les devis déjà émis ne changent pas : générez-en un nouveau pour appliquer les nouveaux prix.`
    );
    if (!ok) return;

    setBusy(btn, true, "Recalcul…");
    try {
      const { data, error } = await sb.rpc("recalculate_sale_lot_prices", { p_sale_lot_id: lot.id });
      if (error) throw new Error(error.message);

      const rows = data ?? [];
      const empty = rows.filter((r) => r.new_auto_sale_price == null).length;
      const changed = lot.autoBefore
        ? rows.filter((r) => !sameAmount(lot.autoBefore[r.device_id], r.new_auto_sale_price)).length
        : null;
      const skipped = lot.devicesCount != null ? Math.max(lot.devicesCount - rows.length, 0) : 0;

      let text = `Prix auto recalculés pour ${rows.length} appareil(s)`;
      if (changed !== null) text += `, dont ${changed} modifié(s)`;
      text += ".";
      if (empty > 0) text += ` ${empty} sans prix auto calculé : le prix budget s'applique.`;
      if (skipped > 0) text += ` ${skipped} ignoré(s) : aucune action « Lot de vente » pour ces appareils.`;
      text += " Les prix personnalisés n'ont pas été touchés.";
      ctx.lotMsg(empty > 0 || skipped > 0 ? "info" : "success", text);

      if (empty > 0) {
        await showExplanation(ctx, rows.filter((r) => r.new_auto_sale_price == null));
      }

      await loadDevices(lot, ctx.devicesEl);
    } catch (e) {
      ctx.lotMsg("error", "Recalcul impossible : " + e.message);
    } finally {
      setBusy(btn, false);
    }
  }

  // Explique pourquoi certains prix auto sont restés vides. La fonction SQL
  // s'exécute avec les droits de l'utilisateur connecté, comme le calcul.
  async function showExplanation(ctx, emptyRows) {
    const { lot, explainEl } = ctx;
    const title = `<div class="explain-title">Pourquoi des prix vides ?</div>`;

    const { data, error } = await sb.rpc("explain_sale_lot_prices", { p_sale_lot_id: lot.id });
    if (error) {
      explainEl.innerHTML = `<div class="explain">${title}<div class="explain-note">Explication indisponible (${escapeHtml(error.message)}). Installez explain_sale_lot_prices.sql dans Supabase.</div></div>`;
      return;
    }

    const byDevice = Object.fromEntries((data ?? []).map((r) => [r.device_id, r]));
    const groups = {};
    const inconsistent = [];
    for (const row of emptyRows) {
      const e = byDevice[row.device_id];
      if (e && e.cause_code === "ok") {
        inconsistent.push(e.barcode);
        continue;
      }
      const key = e ? e.cause_code : "inconnu";
      const text = e ? e.premier_blocage : "Appareil introuvable par l'explication (non lisible par votre compte ?)";
      const label = e ? e.barcode : "?";
      (groups[key] = groups[key] || { text, barcodes: [] }).barcodes.push(label);
    }

    const rows = Object.values(groups)
      .sort((a, b) => b.barcodes.length - a.barcodes.length)
      .map((g) => {
        const shown = g.barcodes.slice(0, 5).map(escapeHtml).join(", ");
        const more = g.barcodes.length > 5 ? ` (+${g.barcodes.length - 5})` : "";
        return `<div class="explain-row"><strong>${g.barcodes.length} appareil(s)</strong> — ${escapeHtml(g.text)}<div class="codes">${shown}${more}</div></div>`;
      })
      .join("");

    const alert = inconsistent.length
      ? `<div class="explain-alert">Incohérence : pour ${inconsistent.length} appareil(s) (${inconsistent.slice(0, 5).map(escapeHtml).join(", ")}), l'explication prévoit un prix mais le calcul n'en a pas produit. Envoyez une capture de ce message.</div>`
      : "";

    explainEl.innerHTML = `<div class="explain">${title}${rows}${alert}</div>`;
  }

  // ------------------------------------------------------------
  // Un devis + son panneau de facturation (avec avoirs)
  // ------------------------------------------------------------
  function renderQuoteItem(ctx, quote, activeInvoice) {
    const item = document.createElement("div");
    item.className = "doc-item";
    item.innerHTML = docRowHtml(quote, activeInvoice ? "Refacturer" : "Facturer");
    attachDownload(item, quote);

    const panel = document.createElement("div");
    panel.className = "invoice-panel";
    panel.innerHTML = `
      ${activeInvoice ? `<div class="msg show info">Ce devis a déjà la facture ${escapeHtml(activeInvoice.reference)} : elle sera annulée et remplacée.</div>` : ""}
      <div class="avoirs-title">Avoirs à déduire (montant hors taxe) — facultatif</div>
      <div data-role="avoirs"></div>
      <div class="panel-buttons">
        <button class="btn secondary small" data-role="add-avoir" type="button">+ Ajouter un avoir</button>
        <button class="btn small" data-role="gen-invoice" type="button">Générer la facture</button>
      </div>
      <div class="msg" data-role="invoice-msg"></div>
    `;
    item.appendChild(panel);

    const avoirsEl = panel.querySelector('[data-role="avoirs"]');
    const msgEl = panel.querySelector('[data-role="invoice-msg"]');
    const genBtn = panel.querySelector('[data-role="gen-invoice"]');

    item.querySelector('[data-role="invoice-toggle"]').addEventListener("click", () => {
      panel.classList.toggle("open");
    });

    panel.querySelector('[data-role="add-avoir"]').addEventListener("click", () => addAvoirRow(avoirsEl));

    genBtn.addEventListener("click", async () => {
      clearMsg(msgEl);

      let avoirs;
      try {
        avoirs = collectAvoirs(avoirsEl);
        const total = avoirs.reduce((s, a) => s + a.amount, 0);
        if (quote.subtotal_ht != null && total > Number(quote.subtotal_ht)) {
          throw new Error(
            `Les avoirs (${fmtMoney(total)}) dépassent le montant HT du devis (${fmtMoney(quote.subtotal_ht)}).`
          );
        }
      } catch (e) {
        showMsg(msgEl, "error", e.message);
        return;
      }

      if (activeInvoice) {
        const ok = confirm(
          `La facture ${activeInvoice.reference} sera annulée et remplacée par une nouvelle facture (nouveau numéro).\n\n` +
          `Les avoirs de l'ancienne facture ne sont pas repris : ressaisissez-les ci-dessus si nécessaire.\n\nContinuer ?`
        );
        if (!ok) return;
      }

      setBusy(genBtn, true, "Génération…");
      try {
        const data = await callFunction("generate-invoice", {
          quote_id: quote.id,
          credit_notes: avoirs,
        });
        ctx.lotMsg("success", `Facture ${data.invoice.reference} générée.`);
        await loadDocuments(ctx); // reconstruit la liste : ce panneau disparaît
      } catch (e) {
        showMsg(msgEl, "error", e.message);
        setBusy(genBtn, false);
      }
    });

    return item;
  }

  function addAvoirRow(container) {
    const row = document.createElement("div");
    row.className = "avoir-row";
    row.innerHTML = `
      <input type="text" placeholder="Référence" data-f="reference" />
      <input type="text" placeholder="Libellé (optionnel)" data-f="label" />
      <input type="text" inputmode="decimal" placeholder="Montant HT" data-f="amount" />
      <button class="rm" type="button" title="Retirer">×</button>
    `;
    row.querySelector(".rm").addEventListener("click", () => row.remove());
    container.appendChild(row);
  }

  function collectAvoirs(container) {
    const avoirs = [];
    for (const row of container.querySelectorAll(".avoir-row")) {
      const reference = row.querySelector('[data-f="reference"]').value.trim();
      const label = row.querySelector('[data-f="label"]').value.trim();
      const rawAmount = row.querySelector('[data-f="amount"]').value.trim();
      if (!reference && !label && !rawAmount) continue; // ligne vide ignorée

      const amount = parseAmount(rawAmount);
      if (!reference) throw new Error("Chaque avoir doit avoir une référence.");
      if (!(amount > 0)) throw new Error(`Montant invalide pour l'avoir « ${reference} ».`);
      avoirs.push({ reference, amount: round2(amount), label: label || "Avoir" });
    }
    return avoirs;
  }

  init();
</script>
